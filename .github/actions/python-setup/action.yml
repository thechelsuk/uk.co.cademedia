name: Python Setup
description: Set up Python, cache pip, and install the importers' dependencies.
inputs:
    python-version:
        description: Python version to install.
        required: false
        default: "3.13"

runs:
    using: composite
    steps:
        - name: Set up Python
          uses: actions/setup-python@v7
          with:
              python-version: ${{ inputs.python-version }}
              cache: pip
              cache-dependency-path: _python/requirements.txt

        - name: Install Python dependencies
          shell: bash
          run: python -m pip install -r ./_python/requirements.txt --quiet
